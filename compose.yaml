name: ludex

services:
  ludex:
    image: ${LUDEX_IMAGE:-ghcr.io/cleeryy/ludex:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ludex
    ports:
      - "8080:8080"
    volumes:
      - ./games:/games
      - ./media:/media
      - ./data:/data
    environment:
      LUDEX_BIND: 0.0.0.0:8080
      LUDEX_SERVER_NAME: ${LUDEX_SERVER_NAME:-Ludex}
      LUDEX_IGDB_CLIENT_ID: ${LUDEX_IGDB_CLIENT_ID:-}
      LUDEX_IGDB_CLIENT_SECRET: ${LUDEX_IGDB_CLIENT_SECRET:-}
      LUDEX_INGEST_ALLOW_PRIVATE: ${LUDEX_INGEST_ALLOW_PRIVATE:-false}
      LUDEX_SCAN_INTERVAL_SECONDS: ${LUDEX_SCAN_INTERVAL_SECONDS:-300}
      LUDEX_LIBRARY_ROOTS: ${LUDEX_LIBRARY_ROOTS:-}
      LUDEX_WATCHER_ENABLED: ${LUDEX_WATCHER_ENABLED:-false}
      LUDEX_WATCHER_DEBOUNCE_MS: ${LUDEX_WATCHER_DEBOUNCE_MS:-5000}
      LUDEX_INTEGRITY_INTERVAL_HOURS: ${LUDEX_INTEGRITY_INTERVAL_HOURS:-168}
      LUDEX_MEDIA_GC_GRACE_HOURS: ${LUDEX_MEDIA_GC_GRACE_HOURS:-24}
      LUDEX_MEDIA_GC_INTERVAL_HOURS: ${LUDEX_MEDIA_GC_INTERVAL_HOURS:-0}
      LUDEX_STORAGE_BACKEND: ${LUDEX_STORAGE_BACKEND:-local}
      # S3-compatible object storage (#47). Set these in .env to move game
      # archives to MinIO, Garage, R2, B2 or AWS S3. The bucket must exist and
      # stay private: Ludex proxies downloads instead of redirecting.
      # Example .env:
      #   LUDEX_STORAGE_BACKEND=s3
      #   LUDEX_S3_ENDPOINT=https://minio.example.lan:9000
      #   LUDEX_S3_REGION=us-east-1
      #   LUDEX_S3_BUCKET=ludex
      #   LUDEX_S3_ACCESS_KEY=ludex
      #   LUDEX_S3_SECRET_KEY=change-me
      #   LUDEX_S3_PATH_STYLE=true
      #   LUDEX_S3_PREFIX=prod
      LUDEX_S3_ENDPOINT: ${LUDEX_S3_ENDPOINT:-}
      LUDEX_S3_REGION: ${LUDEX_S3_REGION:-}
      LUDEX_S3_BUCKET: ${LUDEX_S3_BUCKET:-}
      LUDEX_S3_ACCESS_KEY: ${LUDEX_S3_ACCESS_KEY:-}
      LUDEX_S3_SECRET_KEY: ${LUDEX_S3_SECRET_KEY:-}
      LUDEX_S3_PATH_STYLE: ${LUDEX_S3_PATH_STYLE:-false}
      LUDEX_S3_PREFIX: ${LUDEX_S3_PREFIX:-}
      # Optional bearer token for /metrics. Unset = public but rate-limited.
      LUDEX_METRICS_TOKEN: ${LUDEX_METRICS_TOKEN:-}
      LUDEX_JWT_SECRET: ${LUDEX_JWT_SECRET:-}
      RUST_LOG: ${RUST_LOG:-ludex_server=info,tower_http=warn}
    # The image already runs as uid/gid 1000. Keep it explicit, and make sure
    # ./games ./media ./data are writable by that uid (see docs/DEPLOY.md).
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
