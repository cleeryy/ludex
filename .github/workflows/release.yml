name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify (E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @ludex/e2e exec playwright install --with-deps chromium && break
            echo "playwright install attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          pnpm --filter @ludex/e2e exec playwright install --with-deps chromium

      - name: Run browser E2E gate
        run: scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Ludex $TAG" --generate-notes

  server:
    name: Server binary (linux x86_64)
    runs-on: ubuntu-24.04
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build web UI
        run: pnpm --filter @ludex/web build

      - name: Build server
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --release --locked -p ludex-server --bins --features embed-web
          else
            cargo build --release -p ludex-server --bins --features embed-web
          fi

      - name: Package archive
        run: |
          set -euo pipefail
          NAME="ludex-server-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${NAME}"
          cp target/release/ludex-server "dist/${NAME}/"
          cp target/release/ludex-backup "dist/${NAME}/"
          for file in README.md LICENSE; do
            if [ -f "$file" ]; then cp "$file" "dist/${NAME}/"; fi
          done
          strip "dist/${NAME}/ludex-server" || true
          strip "dist/${NAME}/ludex-backup" || true
          tar -czf "dist/${NAME}.tar.gz" -C "dist/${NAME}" .
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludex-server-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64 (NSIS)
            args: "--bundles nsis"
          - platform: ubuntu-24.04
            label: Linux x64 (AppImage, deb)
            args: "--bundles appimage,deb"
          - platform: macos-latest
            label: macOS universal (dmg)
            args: "--target universal-apple-darwin --bundles app,dmg"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
              libxdo-dev libssl-dev libfuse2t64 libayatana-appindicator3-dev && break
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev libfuse2t64 libayatana-appindicator3-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build web UI
        shell: bash
        run: pnpm --filter @ludex/web build

      - name: Verify the updater signing key is provisioned (#124)
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ] || [ -z "${PASSWORD:-}" ]; then
            echo "::error::bundle.createUpdaterArtifacts is true but TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD are missing. Add the repository secrets (docs/RELEASING.md) or turn updater artifacts off."
            exit 1
          fi

      - name: Configure optional Apple signing (#27)
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERT:-}" ]; then
            echo "No Developer ID certificate secret: ad-hoc signing (Gatekeeper warns)."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<__CERT__"
            printf '%s\n' "$CERT"
            echo "__CERT__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$APPLE_ID_SECRET"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET"
            echo "APPLE_TEAM_ID=$TEAM"
          } >> "$GITHUB_ENV"

      - name: Build desktop bundles and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Ludex ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # tauri-action merges the platform entries into one latest.json and
          # uploads the .sig files next to the bundles.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-24.04
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ludex
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ludex-docker
          cache-to: type=gha,mode=max,scope=ludex-docker
