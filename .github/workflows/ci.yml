name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  docs:
    name: Docs (assets, links, screenshots)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies on purpose: this must also pass on a docs-only clone.
      # Fails when the README (or any Markdown file) points at an image or a
      # document that is not in the tree, when a screenshot listed in the
      # manifest is missing, and when an asset is over its size budget.
      - name: Check documentation references and asset budgets
        run: node scripts/check-assets.mjs

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  postgres:
    name: Rust (PostgreSQL backend)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ludex
          POSTGRES_DB: ludex
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LUDEX_TEST_POSTGRES_URL: postgres://postgres:ludex@127.0.0.1:55432/ludex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: PostgreSQL integration tests (#46)
        run: cargo test -p ludex-server --test postgres

  web:
    name: Web (install, build, typecheck)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Enable the pnpm cache as soon as a lockfile is committed.
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      # i18n gate (#139): catalog parity, placeholders, plural categories,
      # registry/RTL coherence, coverage thresholds, pseudo-locale. A locale
      # whose file is not committed yet is "not shipped" and never fails here.
      - name: i18n gate
        run: pnpm --filter @ludex/web i18n:check

      # Advisory until every top-10 catalog reaches 100 % (the translation
      # lanes run in parallel with this infrastructure work); drop
      # `continue-on-error` once the strict gate is green on main.
      - name: i18n strict coverage (advisory)
        continue-on-error: true
        run: pnpm --filter @ludex/web i18n:strict

      - name: Build web UI
        run: pnpm --filter @ludex/web build

      - name: Typecheck
        run: pnpm --filter @ludex/web exec tsc --noEmit

      - name: Test web helpers
        run: pnpm --filter @ludex/web test

  # Contract gate (#237 wave 1): `apps/web/src/lib/types.gen.ts` is generated
  # from `ludex-server openapi`. A DTO change that is not reflected in the
  # committed file fails here, before any client drifts.
  types:
    name: Types (generated, up to date)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated OpenAPI types
        run: node scripts/gen-types.mjs

  # Coverage (#263). Three jobs because the three test suites live in three
  # different build systems: the root workspace, the desktop crate (its own
  # workspace) and the web app. Each one uploads an lcov file as an artifact
  # and, when a CODECOV_TOKEN secret exists, to Codecov with its own flag.
  #
  # `secrets` is not available in a step-level `if`, so the token is mapped to
  # an env var and the upload is gated on that: forks and a token-less
  # repository still get the artifact, they just skip the upload.
  coverage-rust:
    name: Coverage (Rust workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Soft floor, advisory until the first baseline PRs land (#263): the
      # step fails but the job does not. Measured baseline on 2026-11-16:
      # 83.85 % lines / 83.34 % regions (cargo llvm-cov --workspace
      # --all-targets). Ratchet it up in the same commit that raises the
      # number in docs/CI.md.
      COVERAGE_MIN_LINES: "80"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-targets --locked \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Coverage floor (advisory)
        continue-on-error: true
        run: cargo llvm-cov report --fail-under-lines "${COVERAGE_MIN_LINES}"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Rust workspace coverage"
            echo
            echo '```'
            cat coverage-summary.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust-workspace
          path: |
            lcov.info
            coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: server
          fail_ci_if_error: false

  coverage-web:
    name: Coverage (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Advisory floor. `test:coverage` writes coverage/coverage-summary.json
      # (json-summary reporter), which is what the next step reads.
      COVERAGE_MIN_LINES: "17"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Measure coverage
        run: pnpm --filter @ludex/web test:coverage

      - name: Coverage floor (advisory)
        continue-on-error: true
        run: |
          lines="$(node -e "const s=require('./apps/web/coverage/coverage-summary.json').total; process.stdout.write(String(s.lines.pct))")"
          echo "lines: ${lines}% (floor ${COVERAGE_MIN_LINES}%)"
          node -e "process.exit(Number(process.argv[1]) >= Number(process.argv[2]) ? 0 : 1)" \
            "$lines" "${COVERAGE_MIN_LINES}"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

  # The desktop crate compiles 684 dependencies with instrumentation, so this
  # job only runs on non-PR events and on pull requests that touch the crate.
  # A desktop-only PR pays ~10 minutes; a docs or server PR does not.
  coverage-desktop:
    name: Coverage (desktop crate)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # Provisional: measured on the first main run, then ratcheted the same
      # way as the workspace floor.
      COVERAGE_MIN_LINES: "25"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this run is in scope
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
            -- apps/desktop/src-tauri | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Desktop coverage skipped"
              echo
              echo "No change under \`apps/desktop/src-tauri\` in this pull request."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Tauri system dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
              libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev && break
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev

      - name: Install Rust
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-coverage

      - name: Install cargo-llvm-cov
        if: steps.scope.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --lib --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt

      - name: Coverage floor (advisory)
        if: steps.scope.outputs.run == 'true'
        continue-on-error: true
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov report --fail-under-lines "${COVERAGE_MIN_LINES}"

      - name: Job summary
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          {
            echo "### Desktop crate coverage"
            echo
            echo '```'
            cat apps/desktop/src-tauri/coverage-summary.txt 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-desktop
          path: |
            apps/desktop/src-tauri/lcov.info
            apps/desktop/src-tauri/coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload to Codecov
        if: steps.scope.outputs.run == 'true' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/desktop/src-tauri/lcov.info
          flags: desktop
          fail_ci_if_error: false

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-24.04
    needs: [rust, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          tags: ludex:ci
          cache-from: type=gha,scope=ludex-docker
          cache-to: type=gha,mode=max,scope=ludex-docker

  desktop-check:
    name: Desktop (cargo check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
              libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev && break
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Shared with `desktop-test`: both compile the same dependency graph.
          shared-key: desktop-linux

      - name: Check desktop crate
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --locked
          else
            cargo check
          fi

  # Wave 0 of the 2026-11-16 refactor program (docs/audit/2026-11-16):
  # the desktop suite (839 tests) used to be invisible to CI because
  # `apps/desktop/src-tauri` is its own workspace and only `cargo check` ran.
  desktop-test:
    name: Desktop (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
              libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev && break
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Shared with `desktop-check`: same crate, same dependency graph.
          shared-key: desktop-linux

      # The desktop crate is outside the root workspace, so it has its own
      # lockfile and its own fmt/clippy/test pass. Lints are enforced with
      # `-D warnings`: the baseline is clean as of this job's introduction.
      - name: Format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt -- --check

      - name: Fetch dependencies
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo fetch --locked
          else
            cargo fetch
          fi

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo clippy --locked --all-targets -- -D warnings
          else
            cargo clippy --all-targets -- -D warnings
          fi

      # Offline checks after an explicit fetch: the lockfile is honoured and a
      # missing dependency fails loudly instead of silently resolving a newer
      # version.
      - name: Check
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --locked --offline
          else
            cargo check --offline
          fi

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo test --locked --offline --lib
          else
            cargo test --offline --lib
          fi

  # Wave 0: 49 `cfg(windows)` sites were first compiled after merge, in the
  # edge Windows bundle. This job compiles the desktop crate for the Windows
  # MSVC target on every pull request so a Windows-only regression is caught
  # before it reaches `main`.
  desktop-windows-check:
    name: Desktop (Windows cargo check)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-windows

      - name: Fetch dependencies
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo fetch --locked --target x86_64-pc-windows-msvc
          else
            cargo fetch --target x86_64-pc-windows-msvc
          fi

      - name: Check the desktop crate for Windows
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --locked --offline --target x86_64-pc-windows-msvc
          else
            cargo check --offline --target x86_64-pc-windows-msvc
          fi

  macos-check:
    name: Desktop (macOS cargo check)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Check desktop crate on Apple Silicon
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --locked
          else
            cargo check
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @ludex/e2e exec playwright install --with-deps chromium && break
            echo "playwright install attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          pnpm --filter @ludex/e2e exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-smoke:
    name: Desktop smoke (xvfb)
    runs-on: ubuntu-24.04
    # Advisory until the Tauri window check is stable on every runner. The
    # release gate is E2E; this job catches gross desktop regressions.
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            xvfb \
            xdotool

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build desktop debug binary
        run: pnpm --dir apps/desktop tauri build --debug --no-bundle

      - name: Smoke test the window under Xvfb
        run: xvfb-run -a -s "-screen 0 1440x900x24" scripts/desktop-smoke.sh

  edge-desktop:
    name: Edge desktop (${{ matrix.label }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web, e2e]
    runs-on: ${{ matrix.platform }}
    # A cold cache with the full Tauri release build + linuxdeploy regularly
    # lands around 30-35 min; 40 was tight enough that one slow runner hit the
    # timeout and cancelled mid-bundle (2026-11-19). Keep the bound, give it room.
    timeout-minutes: 60
    permissions:
      contents: write
    # One uploader per platform: two runs must never merge latest.json against
    # the same rolling release at the same time (#264).
    concurrency:
      group: edge-desktop-${{ matrix.label }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            label: Linux x64
            bundles: appimage,deb
          - platform: windows-latest
            label: Windows x64
            bundles: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev libudev-dev libfuse2t64 libayatana-appindicator3-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Stamp the edge version
        id: version
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const path = 'apps/desktop/src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const [major, minor, patch] = config.version.split('-')[0].split('.').map(Number);
          const next = `${major}.${minor}.${patch + 1}-edge.${{ github.run_number }}`;
          config.version = next;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`);
          JS

      - name: Ensure the edge release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view edge >/dev/null 2>&1 || \
            gh release create edge --prerelease --title "Ludex edge" \
              --notes "Rolling prerelease built from main. E2E-gated; not for production."

      - name: Build web UI
        run: pnpm --filter @ludex/web build

      # A re-run of the same workflow keeps the run number, so the stamped edge
      # version and the asset names repeat. tauri-action refuses to overwrite an
      # existing asset, which made every re-run red after a cancellation; drop
      # this run's assets first so the job is idempotent.
      - name: Drop stale edge assets for this run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view edge >/dev/null 2>&1 || exit 0
          gh release view edge --json assets --jq '.assets[].name' | while IFS= read -r name; do
            case "$name" in
              *"$VERSION"*) gh release delete-asset edge "$name" --yes || true ;;
            esac
          done

      - name: Build and upload the edge desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # #186: stamp the commit so an installed edge build can identify itself.
          LUDEX_BUILD_COMMIT: ${{ github.sha }}
        with:
          projectPath: apps/desktop
          tagName: edge
          releaseName: "Ludex edge"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: "--bundles ${{ matrix.bundles }}"

      # #186: the edge channel is where a Windows updater regression shows up
      # first; fail the build when the installer does not carry this commit.
      - name: Verify the Windows installer carries the stamped binary (#186)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LUDEX_BUILD_COMMIT: ${{ github.sha }}
        run: ./scripts/verify-windows-install.ps1 -Commit $env:LUDEX_BUILD_COMMIT

      - name: Checksums and edge upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = 'apps/desktop/src-tauri/target';
          const wanted = (name) =>
            name.endsWith('.AppImage') || name.endsWith('.deb') || name.endsWith('-setup.exe');
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (wanted(entry.name)) files.push(full);
            }
          };
          if (fs.existsSync(root)) walk(root);
          if (files.length === 0) {
            console.error(`::error::no desktop bundle found under ${root} after the build`);
            process.exit(1);
          }
          const sums = [];
          for (const file of files) {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            const line = `${hash}  ${path.basename(file)}\n`;
            fs.writeFileSync(`${file}.sha256`, line);
            sums.push(line.trimEnd());
          }
          const checksums = `edge-checksums-${process.env.LABEL.replace(/\s+/g, '-')}.txt`;
          fs.writeFileSync(checksums, sums.join('\n') + '\n');
          const upload = (args) =>
            execFileSync('gh', ['release', 'upload', 'edge', ...args, '--clobber'], {
              stdio: 'inherit',
            });
          upload([checksums]);
          for (const file of files) upload([file, `${file}.sha256`]);
          console.log(`uploaded ${files.length} bundle(s) for ${process.env.VERSION}`);
          JS

      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludex-edge-${{ matrix.label }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/**/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/bundle/**/*.sig
            apps/desktop/src-tauri/target/**/bundle/**/latest.json
          if-no-files-found: ignore
          retention-days: 14

      # #264: the edge manifest must stay a prerelease payload. The stable
      # updater reads /releases/latest/download/latest.json, which GitHub only
      # resolves for non-prerelease releases, so a stable edge release would
      # hijack every stable client.
      - name: Guard the edge updater manifest (#264)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prerelease="$(gh release view edge --json isPrerelease --jq '.isPrerelease')"
          if [ "$prerelease" != "true" ]; then
            echo "::error::the edge release must stay a prerelease so /releases/latest ignores it"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/edge"
          gh release download edge --pattern latest.json --dir "$RUNNER_TEMP/edge" --clobber
          python3 - "$VERSION" "$RUNNER_TEMP/edge/latest.json" <<'PY'
          import json
          import sys

          version, path = sys.argv[1], sys.argv[2]
          data = json.load(open(path, encoding="utf-8"))
          # The new build is published later by the release job, so this guard
          # checks the *published* edge manifest is an edge build on the edge
          # tag; the exact version is verified by `edge-latest` after publishing.
          published = str(data.get("version", ""))
          if "-edge." not in published:
              sys.exit(f"::error::edge latest.json must carry an -edge. version: {published!r}")
          _ = version
          for name, entry in (data.get("platforms") or {}).items():
              if "/releases/download/edge/" not in (entry.get("url") or ""):
                  sys.exit(f"::error::{name} url does not point at the edge tag")
          print(f"edge latest.json OK: {version}")
          PY

  edge-latest:
    name: Edge updater guard (never latest)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [edge-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the edge manifest and the /releases/latest pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/edge"
          gh release download edge --pattern latest.json --dir "$RUNNER_TEMP/edge" --clobber
          python3 - "$RUNNER_TEMP/edge/latest.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          data = json.load(open(path, encoding="utf-8"))
          version = str(data.get("version", ""))
          if "-edge." not in version:
              sys.exit(f"::error::edge latest.json version is not an edge build: {version!r}")
          platforms = data.get("platforms") or {}
          missing = {"windows-x86_64", "linux-x86_64"} - set(platforms)
          if missing:
              sys.exit(f"::error::edge latest.json lost a platform to a concurrent upload: {sorted(missing)}")
          for name, entry in platforms.items():
              if "/releases/download/edge/" not in (entry.get("url") or ""):
                  sys.exit(f"::error::{name} url does not point at the edge tag")
          print(f"edge latest.json OK: {version}, platforms {', '.join(sorted(platforms))}")
          PY
          stable_tag="$(gh release view --json tagName,isPrerelease --jq 'select(.isPrerelease == false) | .tagName' 2>/dev/null || true)"
          if [ "$stable_tag" = "edge" ]; then
            echo "::error::/releases/latest resolves to the edge release"
            exit 1
          fi
          echo "stable /releases/latest -> ${stable_tag:-none}"

  edge-release:
    name: Edge release (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    # One owner for the rolling tag: the force-push and the release edit must
    # never interleave with another run (#264).
    concurrency:
      group: edge-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for server-affecting changes
        id: changed
        run: |
          set -euo pipefail
          git fetch --force --tags origin || true
          previous="$(git rev-list -n 1 refs/tags/edge 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "no edge tag yet; publishing the first edge build"
          elif git diff --quiet "$previous" HEAD -- \
            crates apps/web Cargo.toml Cargo.lock package.json pnpm-lock.yaml pnpm-workspace.yaml docker; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "no server-affecting changes since edge ($previous); skipping"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "server-affecting changes since edge ($previous)"
          fi

      - name: Install pnpm
        if: steps.changed.outputs.code == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        if: steps.changed.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: steps.changed.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install web dependencies
        if: steps.changed.outputs.code == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build web UI
        if: steps.changed.outputs.code == 'true'
        run: pnpm --filter @ludex/web build

      - name: Build server with embedded web
        if: steps.changed.outputs.code == 'true'
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --release --locked -p ludex-server --bins --features embed-web
          else
            cargo build --release -p ludex-server --bins --features embed-web
          fi

      - name: Package edge archive
        if: steps.changed.outputs.code == 'true'
        run: |
          set -euo pipefail
          NAME="ludex-server-edge-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${NAME}"
          cp target/release/ludex-server "dist/${NAME}/"
          cp target/release/ludex-backup "dist/${NAME}/"
          for file in README.md LICENSE; do
            if [ -f "$file" ]; then cp "$file" "dist/${NAME}/"; fi
          done
          strip "dist/${NAME}/ludex-server" || true
          strip "dist/${NAME}/ludex-backup" || true
          tar -czf "dist/${NAME}.tar.gz" -C "dist/${NAME}" .
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Generate the edge release notes (#264)
        if: steps.changed.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(node - <<'JS'
          const config = require('./apps/desktop/src-tauri/tauri.conf.json');
          const [major, minor, patch] = config.version.split('-')[0].split('.').map(Number);
          console.log(`${major}.${minor}.${patch + 1}-edge.${process.env.GITHUB_RUN_NUMBER}`);
          JS
          )"
          scripts/release-notes.sh --tag edge --channel edge --version "$version" \
            --commit "$SHA" --out "$RUNNER_TEMP/edge-notes.md"
          cat "$RUNNER_TEMP/edge-notes.md"

      - name: Publish edge prerelease
        if: steps.changed.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="edge"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$SHA"
          git push origin "refs/tags/${TAG}" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Ludex edge" --notes-file "$RUNNER_TEMP/edge-notes.md"
          else
            gh release create "$TAG" --prerelease --title "Ludex edge" --notes-file "$RUNNER_TEMP/edge-notes.md"
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
