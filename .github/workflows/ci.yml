name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  postgres:
    name: Rust (PostgreSQL backend)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ludex
          POSTGRES_DB: ludex
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LUDEX_TEST_POSTGRES_URL: postgres://postgres:ludex@127.0.0.1:55432/ludex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: PostgreSQL integration tests (#46)
        run: cargo test -p ludex-server --test postgres

  web:
    name: Web (install, build, typecheck)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Enable the pnpm cache as soon as a lockfile is committed.
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      # i18n gate (#139): catalog parity, placeholders, plural categories,
      # registry/RTL coherence, coverage thresholds, pseudo-locale. A locale
      # whose file is not committed yet is "not shipped" and never fails here.
      - name: i18n gate
        run: pnpm --filter @ludex/web i18n:check

      # Advisory until every top-10 catalog reaches 100 % (the translation
      # lanes run in parallel with this infrastructure work); drop
      # `continue-on-error` once the strict gate is green on main.
      - name: i18n strict coverage (advisory)
        continue-on-error: true
        run: pnpm --filter @ludex/web i18n:strict

      - name: Build web UI
        run: pnpm --filter @ludex/web build

      - name: Typecheck
        run: pnpm --filter @ludex/web exec tsc --noEmit

      - name: Test web helpers
        run: pnpm --filter @ludex/web test

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-24.04
    needs: [rust, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: false
          tags: ludex:ci
          cache-from: type=gha,scope=ludex-docker
          cache-to: type=gha,mode=max,scope=ludex-docker

  desktop-check:
    name: Desktop (cargo check)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
              libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev && break
            echo "apt attempt $attempt failed; retrying in 15s" >&2
            sleep 15
          done
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev libudev-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Check desktop crate
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --locked
          else
            cargo check
          fi

  macos-check:
    name: Desktop (macOS cargo check)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Check desktop crate on Apple Silicon
        working-directory: apps/desktop/src-tauri
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --locked
          else
            cargo check
          fi

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @ludex/e2e exec playwright install --with-deps chromium && break
            echo "playwright install attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          pnpm --filter @ludex/e2e exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: scripts/e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-smoke:
    name: Desktop smoke (xvfb)
    runs-on: ubuntu-24.04
    # Advisory until the Tauri window check is stable on every runner. The
    # release gate is E2E; this job catches gross desktop regressions.
    continue-on-error: true
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libudev-dev \
            xvfb \
            xdotool

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build desktop debug binary
        run: pnpm --dir apps/desktop tauri build --debug --no-bundle

      - name: Smoke test the window under Xvfb
        run: xvfb-run -a -s "-screen 0 1440x900x24" scripts/desktop-smoke.sh

  edge-desktop:
    name: Edge desktop (${{ matrix.label }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web, e2e]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            label: Linux x64
            bundles: appimage,deb
          - platform: windows-latest
            label: Windows x64
            bundles: nsis
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev \
            libxdo-dev libssl-dev libudev-dev libfuse2t64 libayatana-appindicator3-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Stamp the edge version
        id: version
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const path = 'apps/desktop/src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const [major, minor, patch] = config.version.split('-')[0].split('.').map(Number);
          const next = `${major}.${minor}.${patch + 1}-edge.${{ github.run_number }}`;
          config.version = next;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`);
          JS

      - name: Ensure the edge release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view edge >/dev/null 2>&1 || \
            gh release create edge --prerelease --title "Ludex edge" \
              --notes "Rolling prerelease built from main. E2E-gated; not for production."

      - name: Build web UI
        run: pnpm --filter @ludex/web build

      - name: Build and upload the edge desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # #186: stamp the commit so an installed edge build can identify itself.
          LUDEX_BUILD_COMMIT: ${{ github.sha }}
        with:
          projectPath: apps/desktop
          tagName: edge
          releaseName: "Ludex edge"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: "--bundles ${{ matrix.bundles }}"

      # #186: the edge channel is where a Windows updater regression shows up
      # first; fail the build when the installer does not carry this commit.
      - name: Verify the Windows installer carries the stamped binary (#186)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LUDEX_BUILD_COMMIT: ${{ github.sha }}
        run: ./scripts/verify-windows-install.ps1 -Commit $env:LUDEX_BUILD_COMMIT

      - name: Checksums and edge upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          node - <<'JS'
          const { execFileSync } = require('node:child_process');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = 'apps/desktop/src-tauri/target';
          const wanted = (name) =>
            name.endsWith('.AppImage') || name.endsWith('.deb') || name.endsWith('-setup.exe');
          const files = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (wanted(entry.name)) files.push(full);
            }
          };
          if (fs.existsSync(root)) walk(root);
          if (files.length === 0) {
            console.error(`::error::no desktop bundle found under ${root} after the build`);
            process.exit(1);
          }
          const sums = [];
          for (const file of files) {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            const line = `${hash}  ${path.basename(file)}\n`;
            fs.writeFileSync(`${file}.sha256`, line);
            sums.push(line.trimEnd());
          }
          const checksums = `edge-checksums-${process.env.LABEL.replace(/\s+/g, '-')}.txt`;
          fs.writeFileSync(checksums, sums.join('\n') + '\n');
          const upload = (args) =>
            execFileSync('gh', ['release', 'upload', 'edge', ...args, '--clobber'], {
              stdio: 'inherit',
            });
          upload([checksums]);
          for (const file of files) upload([file, `${file}.sha256`]);
          console.log(`uploaded ${files.length} bundle(s) for ${process.env.VERSION}`);
          JS

      - name: Upload the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ludex-edge-${{ matrix.label }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/**/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/**/bundle/**/*.sig
            apps/desktop/src-tauri/target/**/bundle/**/latest.json
          if-no-files-found: ignore
          retention-days: 14

  edge-release:
    name: Edge release (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for server-affecting changes
        id: changed
        run: |
          set -euo pipefail
          git fetch --force --tags origin || true
          previous="$(git rev-list -n 1 refs/tags/edge 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "no edge tag yet; publishing the first edge build"
          elif git diff --quiet "$previous" HEAD -- \
            crates apps/web Cargo.toml Cargo.lock package.json pnpm-lock.yaml pnpm-workspace.yaml docker; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "no server-affecting changes since edge ($previous); skipping"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "server-affecting changes since edge ($previous)"
          fi

      - name: Install pnpm
        if: steps.changed.outputs.code == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        if: steps.changed.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        if: steps.changed.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: steps.changed.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install web dependencies
        if: steps.changed.outputs.code == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Build web UI
        if: steps.changed.outputs.code == 'true'
        run: pnpm --filter @ludex/web build

      - name: Build server with embedded web
        if: steps.changed.outputs.code == 'true'
        run: |
          if [ -f Cargo.lock ]; then
            cargo build --release --locked -p ludex-server --bins --features embed-web
          else
            cargo build --release -p ludex-server --bins --features embed-web
          fi

      - name: Package edge archive
        if: steps.changed.outputs.code == 'true'
        run: |
          set -euo pipefail
          NAME="ludex-server-edge-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${NAME}"
          cp target/release/ludex-server "dist/${NAME}/"
          cp target/release/ludex-backup "dist/${NAME}/"
          for file in README.md LICENSE; do
            if [ -f "$file" ]; then cp "$file" "dist/${NAME}/"; fi
          done
          strip "dist/${NAME}/ludex-server" || true
          strip "dist/${NAME}/ludex-backup" || true
          tar -czf "dist/${NAME}.tar.gz" -C "dist/${NAME}" .
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Publish edge prerelease
        if: steps.changed.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="edge"
          NOTES="Rolling prerelease built from main at ${SHA}. E2E-gated; not for production."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$SHA"
          git push origin "refs/tags/${TAG}" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Ludex edge" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --title "Ludex edge" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
