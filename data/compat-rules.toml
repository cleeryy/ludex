# Ludex compatibility rules (#301).
#
# This file is the shipped half of the compatibility rules database. It answers
# one question: given what Ludex already knows about a game and this machine,
# which launch settings should the first launch use, and why?
#
# It is data, not code. `apps/desktop/src-tauri/src/compat_rules.rs` embeds this
# file at build time, validates it in CI (`cargo test`) and matches it per game.
# The same schema is accepted from a signed download and from a local override
# file, so a rule can reach users without an app release.
#
# Rules are honest by construction:
#   - a rule only states what the launch code actually does, or what the PE
#     header and the host architecture actually say;
#   - no game-specific claim ships without a source and a reason;
#   - a rule that changes nothing is still allowed (an informational issue), but
#     an empty rule is rejected by validation.
#
# Validation (all enforced by tests in compat_rules.rs):
#   - `schema` must be the version this build understands (currently 1);
#   - ids are unique and match [a-z0-9][a-z0-9-]{2,63};
#   - every rule has at least one match condition, a reason, a confidence and a
#     source; a shipped rule never matches on a local `game_id`;
#   - every plan key maps to a real LaunchOptions/DisplayProfile field, and
#     environment variables go through the same validator as the UI (reserved
#     protocol variables are refused);
#   - a `display` override is self-contained: Gamescope mode with a valid
#     resolution, because a partial profile would be a dead key;
#   - prerequisites must be one of the redistributable ids the runtime planner
#     knows, and known-issue codes are unique within a rule.
#
# Versioning: `YYYY.MM` (optionally `.N`). Bump it whenever a rule is added,
# removed or changed, so the UI can say "rule 2026.12" instead of guessing.

schema = 1
version = "2026.11"
updated = "2026-11-19"
description = "Launch defaults Ludex can justify from the launch model, the executable header and the host architecture."

[[rules]]
id = "linux-windows-exe-needs-a-compat-tool"
reason = "The selected file is a Windows executable and this machine runs Linux. Ludex starts it through the best installed compatibility tool: UMU first, then a Proton build, then Wine. Without one of those tools there is no launch path, and Make it run can install UMU."
confidence = "certain"
source = "Ludex launch model (linux_gaming::select_tool and build_launch)"

[rules.match]
platform = "linux"
executable = "windows"

[[rules.known_issues]]
code = "compat-layer-required"
severity = "info"
detail = "The Wine prefix, DXVK/VKD3D translation and the Steam compatibility variables all come from the selected tool. Ludex never mixes two tools in one launch."

[[rules]]
id = "linux-native-executable-runs-directly"
reason = "The selected file is a native binary, not a Windows executable. Ludex runs it directly, with no Wine or Proton layer in the middle, and the per-game prefix is not used."
confidence = "certain"
source = "Ludex launch model (linux_gaming::build_launch)"

[rules.match]
platform = "linux"
executable = "native"

[rules.plan]
mode = "native"

[[rules]]
id = "arm64-windows-exe-on-x86-64"
reason = "The executable targets Windows on ARM64 while this machine is x86_64. Proton, Wine and UMU translate Windows calls, not CPU instructions, so there is no launch path Ludex can configure."
confidence = "certain"
source = "PE header architecture of the chosen executable, host architecture"

[rules.match]
executable = "windows-arm64"
arch = "x86_64"

[[rules.known_issues]]
code = "arm64-executable-on-x86-64"
severity = "blocking"
detail = "Use a native or x86_64 build of the game, or run it on an ARM64 device."

[[rules]]
id = "x86-windows-exe-on-arm64"
reason = "This is an x86 Windows executable on an ARM64 machine. Ludex's compatibility tools do not emulate x86 on ARM64; the game only starts if another layer such as FEX or Box64 is already configured outside Ludex."
confidence = "likely"
source = "PE header architecture of the chosen executable, host architecture"

[rules.match]
executable = "windows"
arch = "aarch64"

[[rules.known_issues]]
code = "x86-on-arm64-needs-external-emulation"
severity = "warning"
detail = "Check that the external emulation layer is registered with the system Wine or Proton build before launching."

[[rules]]
id = "macos-windows-exe-needs-a-wrapper"
reason = "Ludex does not configure a Wine wrapper on macOS by itself. Make it run detects Whisky, CrossOver, Heroic and Sikarugir, and can record the one you installed for this game."
confidence = "certain"
source = "Ludex runtime catalog (macOS wrapper providers)"

[rules.match]
platform = "macos"
executable = "windows"

[[rules.known_issues]]
code = "macos-windows-wrapper-required"
severity = "warning"
detail = "Install one of the wrappers Make it run lists, then select it for this game. Nothing is downloaded without an explicit click."
