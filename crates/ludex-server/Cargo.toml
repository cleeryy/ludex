[package]
name = "ludex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Self-hosted Ludex game library server"

[features]
default = []
embed-web = ["dep:rust-embed"]

[dependencies]
ludex-core = { path = "../ludex-core" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["macros", "multipart"] }
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
sqlx.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
argon2.workspace = true
password-hash.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
rand.workspace = true
subtle.workspace = true
walkdir.workspace = true
notify.workspace = true
tempfile.workspace = true
futures-util = "0.3"
bytes = "1"
url = "2"
tokio-util = { version = "0.7", features = ["io"] }
fs2.workspace = true
object_store.workspace = true
flate2.workspace = true
tar.workspace = true
base64 = "0.22"
rust-embed = { version = "8", optional = true, features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true
zip.workspace = true
sevenz-rust2.workspace = true
