[package]
name = "ludex-desktop"
version = "0.4.8"
description = "Ludex desktop app: install, launch and track DRM-free games"
authors = ["cleeryy"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/cleeryy/ludex"
edition = "2021"

# The desktop app is intentionally outside the root cargo workspace: it needs a
# different target directory and platform-specific dependencies.
[workspace]

[lib]
name = "ludex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ludex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

ludex-core = { path = "../../../crates/ludex-core" }
ludex-server = { path = "../../../crates/ludex-server", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# The Ludusavi manifest is YAML (#107). The manifest is never bundled: Ludex
# only reads a copy the user installed themselves.
serde_yaml = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tar = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
  "gzip",
  "multipart",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
discord-rich-presence = "1.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
fs2 = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["network", "system"] }
sha2 = "0.10"
crc32fast = "1"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Save snapshots (#108): Ludex writes stored entries, while deflate keeps
# manually uploaded snapshots readable on restore. Bounded in saves_sync.rs.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Guided runtime installer (#178): every archive is verified by size and
# SHA-256 before these crates see it; extraction has its own path guards.
flate2 = "1"
tar = "0.4"

# Known-folder resolution (#146): SHGetKnownFolderPath is the only correct way
# to read Documents (OneDrive KFM/GPO), Saved Games and LocalLow on Windows.
# The overlay (#144) also needs GetForegroundWindow/SetForegroundWindow to hand
# input back to the game when it closes.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Native global gamepad listener (#144). `gilrs` reads controllers directly so
# the overlay can open while a game owns the focus; it never injects into the
# game. Linux builds link libudev (build dependency: libudev-dev).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
gilrs = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
