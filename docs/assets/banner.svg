<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Ludex</title>
  <desc id="bannerDesc">Abstract dark banner with the Ludex wordmark and geometric game covers.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2923" stroke-width="1"/>
    </pattern>
    <linearGradient id="coverA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3a2c"/>
      <stop offset="1" stop-color="#0d1713"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2a1a"/>
      <stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="coverC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20303a"/>
      <stop offset="1" stop-color="#0c1215"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#0a0e0c"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.6"/>
  <path d="M0 344H1200" stroke="#1f2e27" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8fa096">
    <text x="72" y="86" font-size="13" letter-spacing="3.2">SELF-HOSTED / DRM-FREE / RUST</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="66" y="244" font-size="138" font-weight="700" letter-spacing="8" fill="#eceee7">LUDEX</text>
    <text x="72" y="292" font-size="24" fill="#c4cec6">Index. Download. Install. Play.</text>
  </g>

  <path d="M72 318H520" stroke="#2a3a32" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#6f8177" font-size="12" letter-spacing="1.6">
    <text x="72" y="348">v0.1</text>
    <text x="128" y="348">MIT OR APACHE-2.0</text>
    <text x="300" y="348">SINGLE BINARY</text>
    <text x="428" y="348">SQLITE</text>
  </g>

  <g transform="translate(820 84)">
    <g transform="rotate(-6 0 0)">
      <rect x="0" y="18" width="150" height="204" rx="8" fill="url(#coverA)" stroke="#2c4437"/>
      <circle cx="74" cy="92" r="38" fill="none" stroke="#c6f24e" stroke-width="1.5" opacity="0.85"/>
      <path d="M52 92H96M74 70V114" stroke="#c6f24e" stroke-width="1.5" opacity="0.55"/>
      <rect x="18" y="176" width="74" height="6" rx="3" fill="#3a5144"/>
      <rect x="18" y="190" width="44" height="4" rx="2" fill="#2a3d33"/>
    </g>
    <g transform="translate(146 0) rotate(4 0 0)">
      <rect x="0" y="0" width="150" height="204" rx="8" fill="url(#coverB)" stroke="#4a3a28"/>
      <path d="M18 138L58 78L98 138Z" fill="none" stroke="#f0b46a" stroke-width="1.5" opacity="0.8"/>
      <path d="M74 62V118" stroke="#f0b46a" stroke-width="1.5" opacity="0.5"/>
      <rect x="18" y="164" width="84" height="6" rx="3" fill="#5a4630"/>
      <rect x="18" y="178" width="50" height="4" rx="2" fill="#3d3022"/>
    </g>
    <g transform="translate(292 24) rotate(8 0 0)">
      <rect x="0" y="0" width="150" height="204" rx="8" fill="url(#coverC)" stroke="#2c3c46"/>
      <rect x="30" y="44" width="90" height="90" rx="4" fill="none" stroke="#8fc6e0" stroke-width="1.5" opacity="0.75"/>
      <path d="M30 74H120M30 104H120M60 44V134M90 44V134" stroke="#8fc6e0" stroke-width="1" opacity="0.3"/>
      <rect x="18" y="164" width="66" height="6" rx="3" fill="#3a4c57"/>
      <rect x="18" y="178" width="92" height="4" rx="2" fill="#2b3942"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#5f7268" font-size="11" letter-spacing="1.2">
    <text x="1128" y="386" text-anchor="end">ABSTRACT ARTWORK</text>
  </g>
</svg>
