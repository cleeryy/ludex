<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="libTitle libDesc">
  <title id="libTitle">Ludex library mockup</title>
  <desc id="libDesc">Abstract wireframe of the Ludex web library: sidebar, search and filters, and a grid of placeholder covers. Not a screenshot.</desc>
  <defs>
