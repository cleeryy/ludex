      <stop offset="0" stop-color="#0d1410"/>
      <stop offset="1" stop-color="#090d0b"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21402f"/><stop offset="1" stop-color="#0e1813"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3d2b19"/><stop offset="1" stop-color="#15110c"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21313b"/><stop offset="1" stop-color="#0c1215"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#332338"/><stop offset="1" stop-color="#120e14"/></linearGradient>
    <linearGradient id="c5" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3a38"/><stop offset="1" stop-color="#0b1514"/></linearGradient>
