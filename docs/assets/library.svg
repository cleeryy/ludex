    <linearGradient id="c8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c35"/><stop offset="1" stop-color="#101014"/></linearGradient>
  </defs>

  <rect width="1200" height="780" fill="#080c0a"/>
  <rect x="24" y="20" width="1152" height="740" rx="16" fill="url(#bg)" stroke="#23312a"/>

  <rect x="24" y="20" width="1152" height="56" rx="16" fill="#101713"/>
  <rect x="24" y="60" width="1152" height="16" fill="#101713"/>
  <circle cx="54" cy="48" r="5" fill="#33443a"/>
