[workspace]
resolver = "2"
members = ["crates/ludex-core", "crates/ludex-server"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["cleeryy"]
repository = "https://github.com/cleeryy/ludex"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "timeout", "limit"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
jsonwebtoken = "9"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
zip = "2"
sevenz-rust2 = "0.13"
unrar = "0.5"
walkdir = "2"
tempfile = "3"
mime_guess = "2"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
rand = "0.8"
notify = "7"
fs2 = "0.4"

