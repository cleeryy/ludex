[workspace]
resolver = "2"
members = ["crates/ludex-core", "crates/ludex-server"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["cleeryy"]
repository = "https://github.com/cleeryy/ludex"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "timeout", "limit"] }
# 0.9.1 is the first release whose sqlite driver accepts libsqlite3-sys 0.40
# (RUSTSEC-2026-0459); 0.9.0 pins it below 0.38 and re-resolves to 0.30.
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "postgres", "chrono", "uuid", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "multipart"] }
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
zip = "9"
sevenz-rust2 = "0.13"
unrar = "0.5"
walkdir = "2"
tempfile = "3"
mime_guess = "2"
sha2 = "0.11"
crc32fast = "1"
hmac = "0.13"
hex = "0.4"
subtle = "2"
rand = "0.8"
notify = "8"
fs2 = "0.4"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
flate2 = "1"
tar = "0.4"

