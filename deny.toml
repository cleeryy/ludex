# cargo-deny policy for Ludex (#263).
#
# The project ships under AGPL-3.0-or-later (LICENSE, Cargo.toml), so the
# allowlist below is the set of licenses we can legally redistribute in a
# binary that links them. Every entry is a deliberate decision; adding one is
# a policy change and belongs in the same pull request as the dependency.
#
# Reference: https://embarkstudios.github.io/cargo-deny/
# Run locally: cargo deny check        (see docs/CI.md)

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate is a warning, not a build break: the lockfile still builds it
# and forcing an upgrade mid-release is how you get an unshipped hotfix.
yanked = "warn"
# Accepted advisories live here as `{ id, reason }` objects with an explicit
# review date in the reason. Keep it empty unless there is no upgrade path.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is flagged unmaintained. It is a direct dependency of ludex-core/ludex-server and the desktop crate, and is pulled in by object_store 0.14.2 and sqlx-core/sqlx-sqlite/sqlx-postgres 0.9.1, so replacing it is a cross-workspace migration to time/jiff with a serialization-format risk. No CVE, no soundness issue; still blocked upstream on sqlx and object_store. Review by 2027-04-15." },
  { id = "RUSTSEC-2026-0542", reason = "humantime 2.4.0 is flagged unmaintained and only enters through object_store 0.14.2 (server object storage; the desktop lockfile inherits it through ludex-server). object_store owns the dependency edge and 0.14.2 is the newest release; we do not call humantime directly. Re-evaluate when object_store bumps or drops it. Review by 2027-04-15." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is unmaintained; desktop-only, reached through glib-macros 0.18.5 <- glib 0.18.5 <- gtk 0.18.2 <- tauri 2.12.7. Build-time proc macro, no runtime code. Fix = tauri moving off gtk 0.18. Review by 2027-04-15." },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 is unmaintained; desktop-only, reached through serde_yaml 0.9.34+deprecated (the newest release). It parses the user-supplied Ludusavi manifest only. Fix = migrate to another YAML parser. Review by 2027-04-15." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.15.1 is unmaintained; desktop-only, reached through zbus 5.19.0 <- tauri-plugin-notification/opener/single-instance 2.x, which all pin zbus ^5. Fix = tauri-plugin 3.0. Review by 2027-04-15." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.5 is unmaintained; same zbus 5.19.0 edge as RUSTSEC-2026-0370, desktop-only. Review by 2027-04-15." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.15.1 is unmaintained; same zbus 5.19.0 edge as RUSTSEC-2026-0370, desktop-only. Build-time derive only. Review by 2027-04-15." },
]

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft: compatible with an
# AGPL-3.0 distribution as long as the MPL files stay MPL) and AGPL itself for
# the workspace crates.
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  # target-lexicon (pulled in by the Tauri toolchain crates) and friends.
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Crates whose license text needs a human decision (bundled third-party code
# under a different license, missing SPDX metadata, …). Empty on purpose:
# anything that needs an entry here needs a review first.
exceptions = []

[bans]
# Duplicate major versions are normal in this tree (two sqlx backends, tauri
# stack); the audit is about knowing them, not blocking them.
multiple-versions = "allow"
wildcards = "warn"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
